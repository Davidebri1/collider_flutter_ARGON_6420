name: collider_flutter
description: 'Collider - AAA Multi-Model AI Spatial Client with VisionOS Glass, 3D Consensus Galaxy, and Smart Gen Suite'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0
  matrix4_transform: ^2.0.1
  dio: ^5.4.3+1
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  uuid: ^4.4.0
  webview_flutter: ^4.7.0
  file_picker: ^8.0.5
  webview_flutter_web: ^0.2.3+4
  web: ^1.1.1
  video_player: ^2.9.2
  in_app_purchase: ^3.2.0
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  device_preview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/apps/
    - assets/html/
